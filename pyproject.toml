[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xixi-server"
version = "0.1.0"
description = "SmolVLM vision, prefill and decode serving with bounded routing and feature reuse"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "xixii421" }]
keywords = ["llm", "multimodal", "serving", "pytorch", "disaggregation", "inference"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 此元数据继续用于上游 Pixi 环境，依赖来自 requirements.txt。
# SmolVLM 主线按 README 使用独立 requirements-vpd-cuda.txt / requirements-pd-local.txt，
# 以 PYTHONPATH=src 运行，避免混装上游 vLLM 的依赖。导入名 lmm_serving 保持兼容。
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/xixii421/xixi-server"
Repository = "https://github.com/xixii421/xixi-server"
Documentation = "https://github.com/xixii421/xixi-server#readme"
Upstream = "https://github.com/Azure/ModServe"
Paper = "https://dl.acm.org/doi/10.1145/3698038.3698540"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Only the importable package is installed (editable, src layout). Run-by-path
# scripts (client/, utils/) and the subsystem entry scripts stay out of the package.
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lmm_serving.config" = ["config.yaml", "load.sh"]
