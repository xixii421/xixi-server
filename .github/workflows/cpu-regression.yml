name: CPU regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-pd-local.txt
      - name: Install CPU model dependencies
        run: python -m pip install -r requirements-pd-local.txt
      - name: Run model and service regressions
        env:
          PYTHONPATH: src
        run: |
          python utils/run_regressions.py \
            --suites vpd_router vpd_parallel vpd_transport vpd vpd_pools vpd_tools vision_cache pd_local pd_service stream_benchmark launcher \
            --timeout 180 --output-dir metrics/ci
      - name: Upload results including failures and skips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-regression
          path: metrics/ci/
